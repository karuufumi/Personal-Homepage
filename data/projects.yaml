- slug: library-management-system
  title: Library Management System
  description: A university library management system for borrowing, returning, catalog search, and user management.
  tags: [.NET, FastAPI, React, PostgreSQL, MongoDB, Docker, Postman]
  date: Sep 2025 – Dec 2025
  status: Hybrid Project (Academic + Independent)
  progress: COMPLETE
  problem: Developed a university library management system for borrowing, returning, catalog search, and user management through a five-sprint Scrum project.
  features: [Simulated a real software development lifecycle through sprint planning iterative implementation testing and review, Built a small FastAPI-based API Gateway for authentication and authorization workflows using OAuth 2.0 concepts and two-factor authentication, Applied layered architecture to improve maintainability modularity and separation of concerns]
