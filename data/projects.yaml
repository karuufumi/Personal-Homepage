- slug: simple-noise-protocol-implementation
  title: Simple Noise Protocol Implementation
  description: A learning-oriented, simplified secure communication protocol prototype based on the Noise Protocol Framework.
  tags: [Python, WebSocket, POSIX]
  date: Apr 2026 – Present
  status: Independent Project
  progress: IN PROGRESS
  problem: Secure communication protocols have several connected steps that are easier to understand by implementing and testing a small, focused prototype. This project explores those steps without presenting itself as production cryptography.
  features: [Handshake logic and key agreement, Encryption and authenticated message exchange, WebSocket-based communication flow]
  learned: The work has helped me think more carefully about message order, key material, and the boundaries between a protocol design and a safe production implementation.
- slug: computer-hardware-benchmarking
  title: Computer Hardware Benchmarking using Statistical Learning Approaches
  description: A hardware benchmarking analysis workflow for processing experimental benchmark data and identifying performance patterns.
  tags: [R, Python, Pandas, NumPy, scikit-learn, Matplotlib]
  date: June 2024 – Feb 2026
  status: Independent Project
  progress: COMPLETE
  problem: Benchmark results can be difficult to interpret when they span hardware configurations and repeated experiments. This workflow processes the data and presents patterns that support comparison and reporting.
  features: [R workflow later extended into a Python data-processing pipeline, Statistical learning methods for performance comparison, Visualizations for benchmark interpretation and reporting]
  learned: I became more comfortable cleaning experimental data, comparing results carefully, and using visualizations to support a clear interpretation rather than just producing charts.
