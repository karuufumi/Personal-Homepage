{{ define "main" }}<main id="main-content" class="app-layout py-12"><a href="{{ "/posts/" | relURL }}" class="text-accent hover:underline">← All posts</a><article class="app-prose mt-8 max-w-app"><h1>{{ .Title }}</h1><p class="text-muted-foreground text-sm">{{ .Date.Format "January 2, 2006" }}</p>{{ .Content }}<hr>{{ range .Params.tags }}<a class="text-accent me-3 text-sm hover:underline" href="{{ printf "/tags/%s/" (. | urlize) | relURL }}">#{{ . }}</a>{{ end }}</article></main>{{ end }}
