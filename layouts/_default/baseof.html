<!doctype html>
<html lang="en" class="overflow-y-scroll scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>!function(){try{var e=localStorage.getItem("theme"),t=matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=e==="dark"||e==="light"?e:t?"dark":"light"}catch(e){document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}}();</script>
  <link rel="icon" type="image/svg+xml" href="{{ "favicon.svg?v=2" | relURL }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/custom.css?v=3" | relURL }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}">
  <meta property="og:description" content="{{ .Description | default site.Params.description }}">
  <script defer src="{{ "js/theme.js" | relURL }}"></script>
</head>
<body class="bg-background font-app text-foreground flex min-h-svh flex-col">
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
</body>
</html>
