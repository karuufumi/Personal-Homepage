{{ define "main" }}
  <main id="main-content" class="app-layout error-page">
    <section class="error-page__content" aria-labelledby="error-page-title">
      <p class="error-page__code" aria-hidden="true">404</p>
      <p class="text-sm uppercase text-accent">Wrong turn</p>
      <h1 id="error-page-title">This page is not here.</h1>
      <div class="error-page__actions">
        <a class="error-page__primary-action" href="{{ "/" | relURL }}">Go to home</a>
        <a class="error-page__secondary-action" href="{{ "/projects/" | relURL }}">Browse projects</a>
      </div>
    </section>
  </main>
{{ end }}
