<section class="contact-form-section" aria-labelledby="contact-form-title">
  <div class="contact-form-heading">
    <p class="text-accent text-sm font-semibold tracking-widest uppercase">Send a message</p>
    <h2 id="contact-form-title">Let’s talk.</h2>
    <p>Use the form below and your email app will open with the message ready to send.</p>
  </div>
  <form class="contact-form" data-contact-form>
    <div class="contact-form-fields">
      <label>Full name <input name="name" type="text" autocomplete="name" placeholder="Your name" required></label>
      <label>Email address <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
    </div>
    <label>Message <textarea name="message" rows="7" placeholder="What would you like to talk about?" required></textarea></label>
    <p class="contact-form-status" data-contact-status role="status" aria-live="polite"></p>
    <button class="contact-form-submit" type="submit"><span aria-hidden="true">↗</span> Open email</button>
  </form>
</section>
